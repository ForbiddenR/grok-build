# Build the Grok Build CLI (`xai-grok-pager`) on Linux.
#
# Targets the composition-root package only — full-workspace builds are slow
# and are not recommended for local or CI use (see README.md).
#
# Job selection:
#   pull_request / push to main  →  check only (host gnu)
#   tag push / workflow_dispatch →  release matrix:
#       - x86_64-unknown-linux-gnu  (glibc)
#       - x86_64-unknown-linux-musl (static; matches shipping Linux binaries)
#
# Version stamping (`GROK_VERSION`) for the release job:
#   - tag push `v0.1.221` / `0.1.221-alpha.4`  → version without leading `v`
#   - workflow_dispatch input `version`        → that string (optional)
#   - otherwise                                → package version from
#     crates/codegen/xai-grok-pager-bin/Cargo.toml

name: Build

on:
  push:
    branches: [main]
    tags:
      # Accept both v-prefixed and bare semver tags.
      - "v*"
      - "[0-9]*"
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "THIRD-PARTY-NOTICES"
      - "crates/codegen/xai-grok-pager/docs/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "THIRD-PARTY-NOTICES"
      - "crates/codegen/xai-grok-pager/docs/**"
  workflow_dispatch:
    inputs:
      version:
        description: >
          Product version to stamp into the binary (GROK_VERSION), e.g. 0.1.221
          or 0.1.221-alpha.4. Leave empty to use the package version from
          xai-grok-pager-bin/Cargo.toml.
        required: false
        type: string
        default: ""

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Avoid incremental artifacts in CI (smaller cache, cleaner rebuilds).
  CARGO_INCREMENTAL: "0"

jobs:
  # ---------------------------------------------------------------------------
  # PR + main: typecheck only (host gnu). Skipped on tags / manual dispatch.
  # ---------------------------------------------------------------------------
  check:
    name: check
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch')
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            pkg-config \
            protobuf-compiler \
            libprotobuf-dev \
            clang \
            libclang-dev
          protoc --version

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92.0"
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: grok-build-check
          cache-on-failure: true

      - name: Verify toolchain + lockfile MSRV gate
        run: |
          rustc -vV
          cargo -V
          test -f Cargo.lock
          cargo metadata --format-version 1 --locked >/dev/null

      - name: Cargo check
        run: cargo check -p xai-grok-pager-bin --locked

  # ---------------------------------------------------------------------------
  # Tag + manual: release builds (gnu + musl) with GROK_VERSION stamp + artifacts.
  # ---------------------------------------------------------------------------
  release:
    name: release (${{ matrix.artifact_suffix }})
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            artifact_suffix: linux-x86_64-gnu
            musl: false
          - target: x86_64-unknown-linux-musl
            artifact_suffix: linux-x86_64-musl
            musl: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve GROK_VERSION
        id: version
        run: |
          set -euo pipefail

          strip_v() {
            # "v0.1.221" -> "0.1.221"; leave bare semver unchanged
            local raw="$1"
            echo "${raw#v}"
          }

          pkg_version() {
            sed -n 's/^version = "\([^"]*\)"/\1/p' \
              crates/codegen/xai-grok-pager-bin/Cargo.toml | head -1
          }

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
            && [ -n "${{ inputs.version }}" ]; then
            VERSION="$(strip_v '${{ inputs.version }}')"
            SOURCE="workflow_dispatch"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="$(strip_v '${{ github.ref_name }}')"
            SOURCE="git-tag"
          else
            VERSION="$(pkg_version)"
            SOURCE="Cargo.toml"
          fi

          if [ -z "$VERSION" ]; then
            echo "::error::Could not resolve GROK_VERSION"
            exit 1
          fi

          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "::error::GROK_VERSION='$VERSION' does not look like a semver (e.g. 0.1.221 or 0.1.221-alpha.4)"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"
          echo "GROK_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Resolved GROK_VERSION=$VERSION (source=$SOURCE)"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            pkg-config \
            protobuf-compiler \
            libprotobuf-dev \
            clang \
            libclang-dev
          if [ "${{ matrix.musl }}" = "true" ]; then
            sudo apt-get install -y --no-install-recommends musl-tools
            musl-gcc --version || true
          fi
          protoc --version

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          # Matches rust-toolchain.toml (channel = "1.92.0").
          toolchain: "1.92.0"
          components: rustfmt, clippy
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: grok-build-release-${{ matrix.target }}
          cache-on-failure: true

      - name: Verify toolchain + lockfile MSRV gate
        run: |
          rustc -vV
          cargo -V
          rustup target list --installed
          test -f Cargo.lock
          cargo metadata --format-version 1 --locked >/dev/null

      - name: Cargo release build (${{ matrix.target }})
        run: |
          cargo build \
            -p xai-grok-pager-bin \
            --release \
            --locked \
            --target "${{ matrix.target }}"
        env:
          GROK_VERSION: ${{ env.GROK_VERSION }}
          # musl-tools provides musl-gcc as the C/C++ linker for the musl target.
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc

      - name: Smoke-test release binary
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/xai-grok-pager"
          test -x "$BIN"
          file "$BIN"
          ls -lh "$BIN"
          # Static musl binaries should not need glibc; gnu is host-native.
          if [ "${{ matrix.musl }}" = "true" ]; then
            # Prefer fully static linkage for portable Linux distro coverage.
            if command -v ldd >/dev/null; then
              if ldd "$BIN" >/tmp/ldd.out 2>&1; then
                echo "::warning::musl binary is not fully static; ldd output:"
                cat /tmp/ldd.out
              else
                echo "ldd reports static (or non-dynamic) binary — good"
                cat /tmp/ldd.out || true
              fi
            fi
          fi
          "$BIN" --version | tee /tmp/ver.txt
          "$BIN" version --json || true
          grep -F "${GROK_VERSION}" /tmp/ver.txt
        env:
          GROK_VERSION: ${{ env.GROK_VERSION }}

      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: xai-grok-pager-${{ matrix.artifact_suffix }}-${{ env.GROK_VERSION }}
          path: target/${{ matrix.target }}/release/xai-grok-pager
          if-no-files-found: error
          retention-days: 14
