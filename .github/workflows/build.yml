# Build the Grok Build CLI (`xai-grok-pager`) on Linux.
#
# Targets the composition-root package only — full-workspace builds are slow
# and are not recommended for local or CI use (see README.md).
#
# Job selection (one job per event — no double matrix on tags):
#   pull_request / push to main  →  check only
#   tag push / workflow_dispatch →  release only (stamped binary + artifact)
#
# Version stamping (`GROK_VERSION`) for the release job:
#   - tag push `v0.1.221` / `0.1.221-alpha.4`  → version without leading `v`
#   - workflow_dispatch input `version`        → that string (optional)
#   - otherwise                                → package version from
#     crates/codegen/xai-grok-pager-bin/Cargo.toml

name: Build

on:
  push:
    branches: [main]
    tags:
      # Accept both v-prefixed and bare semver tags.
      - "v*"
      - "[0-9]*"
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "THIRD-PARTY-NOTICES"
      - "crates/codegen/xai-grok-pager/docs/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "THIRD-PARTY-NOTICES"
      - "crates/codegen/xai-grok-pager/docs/**"
  workflow_dispatch:
    inputs:
      version:
        description: >
          Product version to stamp into the binary (GROK_VERSION), e.g. 0.1.221
          or 0.1.221-alpha.4. Leave empty to use the package version from
          xai-grok-pager-bin/Cargo.toml.
        required: false
        type: string
        default: ""

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Avoid incremental artifacts in CI (smaller cache, cleaner rebuilds).
  CARGO_INCREMENTAL: "0"

jobs:
  # ---------------------------------------------------------------------------
  # PR + main: typecheck only (no release binary).
  # Skipped on tags and manual dispatch so a release tag is a single job.
  # ---------------------------------------------------------------------------
  check:
    name: check
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch')
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            pkg-config \
            protobuf-compiler \
            libprotobuf-dev \
            clang \
            libclang-dev
          protoc --version

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92.0"
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: grok-build-check
          cache-on-failure: true

      - name: Verify toolchain + lockfile MSRV gate
        run: |
          rustc -vV
          cargo -V
          test -f Cargo.lock
          cargo metadata --format-version 1 --locked >/dev/null

      - name: Cargo check
        run: cargo check -p xai-grok-pager-bin --locked

  # ---------------------------------------------------------------------------
  # Tag + manual: release build with GROK_VERSION stamp + artifact.
  # ---------------------------------------------------------------------------
  release:
    name: release
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve GROK_VERSION
        id: version
        run: |
          set -euo pipefail

          strip_v() {
            # "v0.1.221" -> "0.1.221"; leave bare semver unchanged
            local raw="$1"
            echo "${raw#v}"
          }

          pkg_version() {
            sed -n 's/^version = "\([^"]*\)"/\1/p' \
              crates/codegen/xai-grok-pager-bin/Cargo.toml | head -1
          }

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
            && [ -n "${{ inputs.version }}" ]; then
            VERSION="$(strip_v '${{ inputs.version }}')"
            SOURCE="workflow_dispatch"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="$(strip_v '${{ github.ref_name }}')"
            SOURCE="git-tag"
          else
            VERSION="$(pkg_version)"
            SOURCE="Cargo.toml"
          fi

          if [ -z "$VERSION" ]; then
            echo "::error::Could not resolve GROK_VERSION"
            exit 1
          fi

          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "::error::GROK_VERSION='$VERSION' does not look like a semver (e.g. 0.1.221 or 0.1.221-alpha.4)"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"
          echo "GROK_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Resolved GROK_VERSION=$VERSION (source=$SOURCE)"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            pkg-config \
            protobuf-compiler \
            libprotobuf-dev \
            clang \
            libclang-dev
          protoc --version

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92.0"
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: grok-build-release
          cache-on-failure: true

      - name: Verify toolchain + lockfile MSRV gate
        run: |
          rustc -vV
          cargo -V
          test -f Cargo.lock
          cargo metadata --format-version 1 --locked >/dev/null

      - name: Cargo release build
        run: cargo build -p xai-grok-pager-bin --release --locked
        env:
          GROK_VERSION: ${{ env.GROK_VERSION }}

      - name: Smoke-test release binary
        run: |
          set -euo pipefail
          ./target/release/xai-grok-pager --version
          ./target/release/xai-grok-pager version --json || true
          file ./target/release/xai-grok-pager
          ls -lh ./target/release/xai-grok-pager
          ./target/release/xai-grok-pager --version | tee /tmp/ver.txt
          grep -F "${GROK_VERSION}" /tmp/ver.txt
        env:
          GROK_VERSION: ${{ env.GROK_VERSION }}

      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: xai-grok-pager-linux-x86_64-${{ env.GROK_VERSION }}
          path: target/release/xai-grok-pager
          if-no-files-found: error
          retention-days: 14
